<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定在波マップジェネレーター v13</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#fff;color:#1a1a1a;padding:16px;}
.wrap{padding:12px 0;}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.inp-group{display:flex;align-items:center;gap:6px;}
label{font-size:13px;color:#555;white-space:nowrap;}
input[type=number]{width:80px;font-size:13px;padding:6px 8px;border:1px solid #ccc;border-radius:6px;}
button{font-size:12px;padding:5px 13px;border:1px solid #aaa;border-radius:6px;background:#fff;cursor:pointer;}
button:hover{background:#f0f0f0;}
.btn-toggle.on{background:#dbeafe;color:#1e40af;border-color:#93c5fd;}
.map-wrap{position:relative;margin:12px 0;}
canvas{display:block;cursor:crosshair;}
.info-panel{background:#f5f5f0;border:0.5px solid #ddd;border-radius:8px;padding:8px 14px;font-size:12px;color:#555;min-height:32px;line-height:1.7;margin-bottom:6px;}
.history-wrap{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.hist-row{display:flex;align-items:center;gap:8px;background:#f5f5f0;border:0.5px solid #ddd;border-radius:8px;padding:6px 12px;cursor:pointer;transition:background 0.15s;}
.hist-row:hover{background:#ebebeb;}
.hist-row.active{outline:1.5px solid #E24B4A;}
.hist-label{font-size:11px;color:#777;min-width:36px;}
.hist-coord{font-size:12px;color:#1a1a1a;font-weight:500;flex:1;}
.hist-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:#fce8e8;color:#a32d2d;border:0.5px solid #f09595;}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:11px;}
.leg-item{display:flex;align-items:center;gap:6px;}
</style>
<script>
(function(){
  var pw = "wavemap";
  var input = prompt("パスワードを入力してください");
  if(!input || input !== pw){
    document.addEventListener('DOMContentLoaded', function(){
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#555;font-size:16px;">パスワードが違います</div>';
    });
  }
})();
</script>
</head>
<body>
<div class="wrap">
<div class="row">
  <div class="inp-group"><label>長辺 (cm)</label><input type="number" id="inp-l" value="360" min="10" max="5000"></div>
  <div class="inp-group"><label>短辺 (cm)</label><input type="number" id="inp-s" value="270" min="10" max="5000"></div>
  <button onclick="draw()">描画</button>
  <button id="btn-orient" class="btn-toggle" onclick="toggleOrient()">縦長表示</button>
  <button id="btn-hist" class="btn-toggle" onclick="toggleHist()">履歴 OFF</button>
</div>
<div class="map-wrap"><canvas id="cvs"></canvas></div>
<div class="info-panel" id="info">マップ上をクリックすると座標と最寄りの腹/節を表示します。</div>
<div class="history-wrap" id="history-wrap"></div>
<div class="legend" id="legend"></div>

<script>
const MODES=[
  {n:1,color:'#185FA5',sw:[7,4]},
  {n:2,color:'#1D9E75',sw:[4.5,2.5]},
  {n:3,color:'#BA7517',sw:[2.5,1.5]},
  {n:4,color:'#E24B4A',sw:[1.2,0.7]}
];
const SPEED=343;
const FIXED_LONG=540;
const FIXED_SHORT=400;

let state={
  L:360,S:270,ox:0,oy:0,MAP_W:0,MAP_H:0,
  scaleL:1,scaleS:1,modesL:[],modesS:[],
  allColsL:[],allRowsS:[],clicks:[],activeIdx:-1,
  portrait:false,histOn:false,lastClickPx:null
};

function calcModes(L){
  return MODES.map(m=>{
    const hz=Math.round(SPEED/(2*L/100)*m.n);
    const antis=[];for(let k=0;k<=m.n;k++) antis.push(Math.round(k*L/m.n));
    const nodes=[];for(let k=1;k<=m.n;k++) nodes.push(Math.round((2*k-1)*L/(2*m.n)));
    return{n:m.n,color:m.color,sw:m.sw,hz,antis,nodes};
  });
}
function nearWall(cm,total){return cm<=total-cm?{dist:cm,wall:'左壁'}:{dist:total-cm,wall:'右壁'};}

function nearest(list,val){
  let best=null,bestD=9999;
  list.forEach(it=>{const d=Math.abs(it.cm-val);if(d<bestD){bestD=d;best={...it,diff:d};}});
  return best;
}

function toggleOrient(){
  state.portrait=!state.portrait;
  const btn=document.getElementById('btn-orient');
  btn.textContent=state.portrait?'横長表示':'縦長表示';
  btn.classList.toggle('on',state.portrait);
  state.clicks=[];state.activeIdx=-1;state.lastClickPx=null;
  rebuildLayout();renderCanvas();updateHistory();
  document.getElementById('info').innerHTML='マップ上をクリックすると座標と最寄りの腹/節を表示します。';
}

function toggleHist(){
  state.histOn=!state.histOn;
  const btn=document.getElementById('btn-hist');
  btn.textContent=state.histOn?'履歴 ON':'履歴 OFF';
  btn.classList.toggle('on',state.histOn);
  if(!state.histOn) state.activeIdx=-1;
  renderCanvas();updateHistory();
}

function rebuildLayout(){
  const {L,S,portrait}=state;
  let MAP_W,MAP_H;
  const PAD_TOP=66,PAD_BOT=32,PAD_LEFT=56,PAD_RIGHT=150;

  if(!portrait){
    const aspect=S/L;
    MAP_W=FIXED_LONG;MAP_H=Math.round(MAP_W*aspect);
    if(MAP_H>FIXED_SHORT){MAP_H=FIXED_SHORT;MAP_W=Math.round(MAP_H/aspect);}
    if(MAP_W<200){MAP_W=200;MAP_H=Math.round(200*aspect);}
    if(MAP_H<120){MAP_H=120;MAP_W=Math.round(120/aspect);}
  } else {
    const aspect=L/S;
    MAP_H=FIXED_LONG;MAP_W=Math.round(MAP_H/aspect);
    if(MAP_W>FIXED_SHORT){MAP_W=FIXED_SHORT;MAP_H=Math.round(MAP_W*aspect);}
    if(MAP_H<200){MAP_H=200;MAP_W=Math.round(200/aspect);}
    if(MAP_W<120){MAP_W=120;MAP_H=Math.round(120*aspect);}
  }

  const ox=PAD_LEFT,oy=PAD_TOP;
  const CVS_W=PAD_LEFT+MAP_W+PAD_RIGHT;
  const CVS_H=PAD_TOP+MAP_H+PAD_BOT;
  const scaleL=portrait?MAP_H/L:MAP_W/L;
  const scaleS=portrait?MAP_W/S:MAP_H/S;
  state={...state,ox,oy,MAP_W,MAP_H,scaleL,scaleS,CVS_W,CVS_H};

  const cvs=document.getElementById('cvs');
  cvs.width=CVS_W;cvs.height=CVS_H;
  cvs.style.width=CVS_W+'px';cvs.style.maxWidth='100%';
}

function drawTopLabels(ctx,list,ox,oy,scale){
  const usedTop=new Map();
  list.sort((a,b)=>a.m.n-b.m.n).forEach(({cm,type,m})=>{
    const x=Math.round(ox+cm*scale);
    const row=type==='腹'?0:1;
    const key=`${x}_${row}`;
    if(usedTop.has(key)) return;
    usedTop.set(key,true);
    ctx.fillStyle=m.color;
    ctx.font=(type==='腹'?'bold ':'')+'9px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(cm,x,oy-(row===0?28:40));
  });
}

function drawRightLabels(ctx,list,ox,oy,MAP_W,scale){
  const LABEL_GAP=16;
  const COL0_X=ox+MAP_W+14;
  const COL1_X=ox+MAP_W+46;
  const usedRight=[];
  list.sort((a,b)=>a.m.n-b.m.n).forEach(({cm,type,m})=>{
    const y=Math.round(oy+cm*scale);
    const col=type==='腹'?0:1;
    const xBase=col===0?COL0_X:COL1_X;
    let yAdj=y+4;
    const conf=usedRight.filter(p=>p.col===col&&Math.abs(p.y-yAdj)<LABEL_GAP);
    if(conf.length>0) yAdj=Math.max(...conf.map(p=>p.y))+LABEL_GAP;
    usedRight.push({col,y:yAdj});
    ctx.beginPath();ctx.moveTo(ox+MAP_W+2,y);ctx.lineTo(xBase-2,yAdj-3);
    ctx.strokeStyle=m.color;ctx.globalAlpha=0.45;ctx.lineWidth=0.5;ctx.setLineDash([]);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=m.color;
    ctx.font=(type==='腹'?'bold ':'')+'9px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(cm,xBase,yAdj);
  });
  ctx.globalAlpha=1;ctx.setLineDash([]);
}

function renderCanvas(){
  const cvs=document.getElementById('cvs');
  const ctx=cvs.getContext('2d');
  const {L,S,ox,oy,MAP_W,MAP_H,scaleL,scaleS,modesL,modesS,allColsL,allRowsS,
         clicks,activeIdx,portrait,histOn,lastClickPx}=state;

  ctx.clearRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle='#f5f5f0';ctx.fillRect(ox,oy,MAP_W,MAP_H);

  [...MODES].reverse().forEach((_,ri)=>{
    const i=MODES.length-1-ri;
    const mL=modesL[i],mS=modesS[i];
    mL.antis.forEach(a=>{
      if(a===0||a===L) return;
      let x1,y1,x2,y2;
      if(!portrait){x1=x2=ox+a*scaleL;y1=oy;y2=oy+MAP_H;}
      else{y1=y2=oy+a*scaleL;x1=ox;x2=ox+MAP_W;}
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=mL.color;ctx.globalAlpha=0.9;ctx.lineWidth=mL.sw[0];ctx.setLineDash([]);ctx.stroke();
    });
    mL.nodes.forEach(nd=>{
      let x1,y1,x2,y2;
      if(!portrait){x1=x2=ox+nd*scaleL;y1=oy;y2=oy+MAP_H;}
      else{y1=y2=oy+nd*scaleL;x1=ox;x2=ox+MAP_W;}
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=mL.color;ctx.globalAlpha=0.85;ctx.lineWidth=mL.sw[1];ctx.setLineDash([8,5]);ctx.stroke();
    });
    mS.antis.forEach(a=>{
      if(a===0||a===S) return;
      let x1,y1,x2,y2;
      if(!portrait){y1=y2=oy+a*scaleS;x1=ox;x2=ox+MAP_W;}
      else{x1=x2=ox+a*scaleS;y1=oy;y2=oy+MAP_H;}
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=mS.color;ctx.globalAlpha=0.9;ctx.lineWidth=mS.sw[0];ctx.setLineDash([]);ctx.stroke();
    });
    mS.nodes.forEach(nd=>{
      let x1,y1,x2,y2;
      if(!portrait){y1=y2=oy+nd*scaleS;x1=ox;x2=ox+MAP_W;}
      else{x1=x2=ox+nd*scaleS;y1=oy;y2=oy+MAP_H;}
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=mS.color;ctx.globalAlpha=0.85;ctx.lineWidth=mS.sw[1];ctx.setLineDash([8,5]);ctx.stroke();
    });
  });
  ctx.globalAlpha=1;ctx.setLineDash([]);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.strokeRect(ox,oy,MAP_W,MAP_H);

  ctx.fillStyle='#666';ctx.font='10px sans-serif';
  if(!portrait){
    ctx.textAlign='center';
    ctx.fillText(`長辺（上壁）${L}cm`,ox+MAP_W/2,oy-50);
    ctx.fillText(`長辺（下壁）${L}cm`,ox+MAP_W/2,oy+MAP_H+20);
    ctx.save();ctx.translate(ox-38,oy+MAP_H/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(`短辺（左壁）${S}cm`,0,0);ctx.restore();
    ctx.save();ctx.translate(ox+MAP_W+120,oy+MAP_H/2);ctx.rotate(Math.PI/2);
    ctx.fillText(`短辺（右壁）${S}cm`,0,0);ctx.restore();
  } else {
    ctx.textAlign='center';
    ctx.fillText(`短辺（上壁）${S}cm`,ox+MAP_W/2,oy-50);
    ctx.fillText(`短辺（下壁）${S}cm`,ox+MAP_W/2,oy+MAP_H+20);
    ctx.save();ctx.translate(ox-38,oy+MAP_H/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(`長辺（左壁）${L}cm`,0,0);ctx.restore();
    ctx.save();ctx.translate(ox+MAP_W+120,oy+MAP_H/2);ctx.rotate(Math.PI/2);
    ctx.fillText(`長辺（右壁）${L}cm`,0,0);ctx.restore();
  }

  if(!portrait){
    drawTopLabels(ctx,allColsL,ox,oy,scaleL);
    drawRightLabels(ctx,allRowsS,ox,oy,MAP_W,scaleS);
  } else {
    drawTopLabels(ctx,allRowsS,ox,oy,scaleS);
    drawRightLabels(ctx,allColsL,ox,oy,MAP_W,scaleL);
  }

  if(histOn){
    clicks.forEach((c,i)=>{
      const px=portrait?ox+c.cmY*scaleS:ox+c.cmX*scaleL;
      const py=portrait?oy+c.cmX*scaleL:oy+c.cmY*scaleS;
      const isActive=(i===activeIdx);
      const r=isActive?8:5;const lw=isActive?2.5:1.5;
      ctx.strokeStyle='#E24B4A';ctx.lineWidth=lw;ctx.setLineDash([]);
      if(isActive){ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.stroke();}
      const s=r*0.7;
      ctx.beginPath();ctx.moveTo(px-s,py-s);ctx.lineTo(px+s,py+s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px+s,py-s);ctx.lineTo(px-s,py+s);ctx.stroke();
    });
  } else {
    if(lastClickPx){
      const {px,py}=lastClickPx;
      ctx.strokeStyle='#E24B4A';ctx.lineWidth=2;ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.stroke();
    }
  }
}

function updateHistory(){
  const wrap=document.getElementById('history-wrap');
  if(!state.histOn||state.clicks.length===0){wrap.innerHTML='';return;}
  const labels=['直前','1回前','2回前'];
  wrap.innerHTML=state.clicks.map((c,i)=>{
    const active=i===state.activeIdx;
    return `<div class="hist-row${active?' active':''}" onclick="selectHistory(${i})">
      <span class="hist-label">${labels[i]}</span>
      <span class="hist-coord">短辺(${c.wx.wall})${c.wx.dist}cm　長辺(${c.wy.wall})${c.wy.dist}cm</span>
      <span class="hist-badge">${active?'表示中':'クリックで表示'}</span>
    </div>`;
  }).join('');
}

function selectHistory(idx){
  state.activeIdx=state.activeIdx===idx?-1:idx;
  renderCanvas();updateHistory();
}

function draw(){
  const L=Math.max(10,parseInt(document.getElementById('inp-l').value)||360);
  const S=Math.max(10,parseInt(document.getElementById('inp-s').value)||270);
  document.getElementById('inp-l').value=L;
  document.getElementById('inp-s').value=S;

  const modesL=calcModes(L),modesS=calcModes(S);
  const allColsL=[],allRowsS=[];
  modesL.forEach(m=>{
    m.antis.forEach(a=>{if(a>0&&a<L) allColsL.push({cm:a,type:'腹',m});});
    m.nodes.forEach(nd=>allColsL.push({cm:nd,type:'節',m}));
  });
  modesS.forEach(m=>{
    m.antis.forEach(a=>{if(a>0&&a<S) allRowsS.push({cm:a,type:'腹',m});});
    m.nodes.forEach(nd=>allRowsS.push({cm:nd,type:'節',m}));
  });

  state={...state,L,S,modesL,modesS,allColsL,allRowsS,clicks:[],activeIdx:-1,lastClickPx:null};
  rebuildLayout();renderCanvas();updateHistory();
  document.getElementById('info').innerHTML='マップ上をクリックすると座標と最寄りの腹/節を表示します。';

  const cvs=document.getElementById('cvs');
  cvs.onclick=function(e){
    const rect=cvs.getBoundingClientRect();
    const scale=cvs.width/rect.width;
    const px=(e.clientX-rect.left)*scale;
    const py=(e.clientY-rect.top)*scale;
    const {L,S,ox,oy,scaleL,scaleS,allColsL,allRowsS,portrait}=state;
    let cmX,cmY;
    if(!portrait){cmX=Math.round((px-ox)/scaleL);cmY=Math.round((py-oy)/scaleS);}
    else{cmX=Math.round((py-oy)/scaleL);cmY=Math.round((px-ox)/scaleS);}
    if(cmX<0||cmX>L||cmY<0||cmY>S){
      document.getElementById('info').innerHTML='部屋の外をクリックしました。';return;
    }
    const wx=nearWall(cmX,L),wy=nearWallV(cmY,S);
    const nearX=nearest(allColsL,cmX),nearY=nearest(allRowsS,cmY);
    state.lastClickPx={px,py};
    state.clicks.unshift({cmX,cmY,wx,wy});
    if(state.clicks.length>3) state.clicks.pop();
    state.activeIdx=0;
    renderCanvas();
    let html=`短辺（${wx.wall}）から <b style="color:#1a1a1a">${wx.dist}cm</b>　　長辺（${wy.wall}）から <b style="color:#1a1a1a">${wy.dist}cm</b>`;
    if(nearX) html+=`<br>長辺方向：<b style="color:${nearX.m.color}">Mode${nearX.m.n}（${nearX.m.hz}Hz）の${nearX.type}</b>　${nearX.cm}cm（差 ${nearX.diff}cm）`;
    if(nearY) html+=`<br>短辺方向：<b style="color:${nearY.m.color}">Mode${nearY.m.n}（${nearY.m.hz}Hz）の${nearY.type}</b>　${nearY.cm}cm（差 ${nearY.diff}cm）`;
    document.getElementById('info').innerHTML=html;
    updateHistory();
  };

  const lg=document.getElementById('legend');lg.innerHTML='';
  MODES.forEach((m,i)=>{
    const mL=modesL[i],mS=modesS[i];
    const div=document.createElement('div');div.className='leg-item';
    div.innerHTML=
      `<svg width="28" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="${m.color}" stroke-width="${m.sw[0]}"/></svg>`+
      `<span style="color:${m.color}">Mode${m.n} 腹</span>`+
      `<svg width="28" height="12"><line x1="0" y1="6" x2="28" y2="6" stroke="${m.color}" stroke-width="${m.sw[1]}" stroke-dasharray="7 4"/></svg>`+
      `<span style="color:${m.color}">節　長辺${mL.hz}Hz / 短辺${mS.hz}Hz</span>`;
    lg.appendChild(div);
  });
}

draw();
</script>
